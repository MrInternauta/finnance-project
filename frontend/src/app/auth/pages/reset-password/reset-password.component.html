<div class="flex bg-regularBG dark:bg-regularBGdark min-h-screen">
  <div class="grid grid-cols-12 w-full items-center">
    <div class="col-span-12">
      <div class="px-[100px] 3xl:px-[200px] max-md:px-[30px] max-md:pt-[120px] pt-[50px]">
        <a href="">
          <img class="dark:hidden" src="assets/img/logo.svg" alt="logo">
          <img class="hidden dark:block" src="assets/img/logo-white.svg" alt="logo">
        </a>
      </div>
      <div class="px-[30px] py-[25px]">
        <div class="pt-[90px] max-md:pt-[20px] pb-[30px] min-h-[calc(100vh-192px)] flex items-center">
          <div class="flex items-center justify-center w-full px-[15px]">
            <form nz-form [formGroup]="myForm" class="w-full max-w-[580px]">
              <nz-form-item>
                <nz-form-control nzErrorTip="Ingresa tu nueva contraseña">
                  <input class="flex items-center shadow-none py-[10px] px-[20px] h-[48px] border-1 border-regular dark:border-white/10 rounded-4 w-full text-[14px] font-normal leading-[1.5]" nz-input formControlName="password" placeholder="Nueva contraseña" type="password" id="password" />
                </nz-form-control>
              </nz-form-item>
              <nz-form-item>
                <nz-form-control nzErrorTip="Las contraseñas no coinciden">
                  <input class="flex items-center shadow-none py-[10px] px-[20px] h-[48px] border-1 border-regular dark:border-white/10 rounded-4 w-full text-[14px] font-normal leading-[1.5]" nz-input formControlName="checkPassword" placeholder="Confirmar contraseña" type="password" id="checkPassword" />
                </nz-form-control>
              </nz-form-item>
              <button nz-button (click)="submitForm()" class="mt-[20px] inline-flex items-center justify-center h-[52px] text-14 rounded-6 font-medium bg-primary border-primary text-white cursor-pointer hover:bg-primary-hbr transition duration-300 md:px-[50px] px-[30px] py-[15px]">
                Restablecer contraseña
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
